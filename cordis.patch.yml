# dsh-drop-to-workspace bundle patch
#
# When this plugin is installed through the official CLI —
#
#   dsh plugin --profile desktop add github:flandre0605/dsh-drop-to-workspace
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-drop-to-workspace` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) exactly like a manual cordis.patch.yml mount line.
#
# Use `--profile web` for a standalone web server. Browsers ask users to
# choose a directory with Harness's picker instead of the desktop path bridge.
- insert:
    - id: drop-to-workspace
      name: 'dsh-drop-to-workspace'
